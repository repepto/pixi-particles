name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            particle-core/package-lock.json
            particle-editor/package-lock.json
      - name: Install and link the local core package
        run: npm run setup
      - name: Type-check, test, build and package
        run: npm run release
      - name: Upload the showcase archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: particle-system-showcase
          path: release/particle-system-showcase.zip
          if-no-files-found: error
